<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Calendar — SnapCaption AI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f13;--card:#1a1a24;--card2:#1e1e2c;--border:rgba(255,255,255,.08);
  --text:#e8e8f0;--muted:#78788a;--muted2:#a0a0b8;
  --grad1:#a855f7;--grad2:#38bdf8;
  --ig:#a855f7;--tt:#e2e2e2;--tw:#38bdf8;--li:#0ea5e9;--fb:#60a5fa;--yt:#ef4444;--pi:#f43f5e;--ot:#fb923c;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── NAV ── */
.nav{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#16161e;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.nav-logo{font-weight:800;font-size:1.05rem;background:linear-gradient(135deg,var(--grad1),var(--grad2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
.nav-links{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.nav-link{color:var(--muted2);font-size:.8rem;text-decoration:none;padding:5px 11px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.nav-link:hover,.nav-link.active{background:rgba(168,85,247,.15);color:#c084fc;border-color:rgba(168,85,247,.3)}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;padding:16px 20px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.month-nav{display:flex;align-items:center;gap:8px}
.month-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
.month-btn:hover{background:rgba(168,85,247,.2)}
.month-label{font-size:1.1rem;font-weight:700;min-width:160px;text-align:center}
.today-btn{padding:7px 14px;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--muted2);font-size:.82rem;cursor:pointer}
.today-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.view-tabs{display:flex;gap:4px;margin-left:auto}
.view-tab{padding:7px 14px;border-radius:8px;font-size:.82rem;cursor:pointer;background:var(--card);border:1px solid var(--border);color:var(--muted2)}
.view-tab.active{background:linear-gradient(135deg,var(--grad1),var(--grad2));border-color:transparent;color:#fff;font-weight:600}
.add-post-btn{padding:8px 18px;background:linear-gradient(135deg,var(--grad1),var(--grad2));border:none;border-radius:10px;color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;align-items:center;gap:6px}
.add-post-btn:hover{opacity:.88}

/* ── PLATFORM LEGEND ── */
.legend{display:flex;gap:10px;padding:0 20px 12px;max-width:1100px;margin:0 auto;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:5px;font-size:.73rem;color:var(--muted2);padding:3px 8px;border-radius:50px;background:rgba(255,255,255,.04);border:1px solid var(--border)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ── CALENDAR GRID ── */
.cal-wrap{padding:0 20px 60px;max-width:1100px;margin:0 auto}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.cal-header-cell{background:#16161e;padding:9px 4px;text-align:center;font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.cal-day{
  background:var(--card);min-height:95px;padding:7px 6px;cursor:pointer;
  transition:background .15s;position:relative;vertical-align:top;
}
.cal-day:hover{background:var(--card2)}
.cal-day.today{outline:2px solid rgba(168,85,247,.5);outline-offset:-2px}
.cal-day.other-month{background:#141418}
.cal-day.other-month .day-num{color:#2c2c40}
.cal-day.selected{background:rgba(168,85,247,.1)}
.day-num{
  font-size:.8rem;font-weight:600;color:var(--muted2);display:inline-flex;
  align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;margin-bottom:4px;
}
.cal-day.today .day-num{background:linear-gradient(135deg,var(--grad1),var(--grad2));color:#fff;font-weight:800}
.day-posts{display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day-post-pill{
  display:flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;
  font-size:.7rem;line-height:1.3;cursor:pointer;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);
}
.day-post-pill:hover{opacity:.8}
.pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pill-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:.68rem}
.day-more{font-size:.65rem;color:var(--muted);text-align:center;margin-top:2px;cursor:pointer}
.day-more:hover{color:var(--grad2)}

/* Platform colors */
.pc-instagram{background:var(--ig)}
.pc-tiktok   {background:var(--tt)}
.pc-twitter  {background:var(--tw)}
.pc-linkedin {background:var(--li)}
.pc-facebook {background:var(--fb)}
.pc-youtube  {background:var(--yt)}
.pc-pinterest{background:var(--pi)}
.pc-other    {background:var(--ot)}
.pt-instagram{color:var(--ig)}
.pt-tiktok   {color:var(--tt)}
.pt-twitter  {color:var(--tw)}
.pt-linkedin {color:var(--li)}
.pt-facebook {color:var(--fb)}
.pt-youtube  {color:var(--yt)}
.pt-pinterest{color:var(--pi)}
.pt-other    {color:var(--ot)}

/* Status pill styles */
.status-idea   {border-color:rgba(168,85,247,.3)!important;color:var(--muted2)}
.status-draft  {border-color:rgba(56,189,248,.3)!important;color:#38bdf8}
.status-ready  {border-color:rgba(16,185,129,.3)!important;color:#34d399}
.status-posted {opacity:.5}

/* ── LIST VIEW ── */
.list-view{display:none;flex-direction:column;gap:10px;padding:0 20px 60px;max-width:1100px;margin:0 auto}
.list-view.active{display:flex}
.list-date-group{}
.list-date-label{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-bottom:1px solid var(--border);margin-bottom:6px}
.list-post-card{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;cursor:pointer;
}
.list-post-card:hover{background:var(--card2)}
.lpc-platform{width:7px;height:7px;border-radius:50%;flex-shrink:0;align-self:stretch;border-radius:4px;width:4px}
.lpc-time{font-size:.78rem;color:var(--muted);min-width:50px}
.lpc-title{font-size:.88rem;font-weight:600;flex:1}
.lpc-status{font-size:.72rem;padding:3px 8px;border-radius:50px;border:1px solid;font-weight:600}
.lpc-plat-badge{font-size:.72rem;padding:2px 8px;border-radius:50px;background:rgba(255,255,255,.07);color:var(--muted2)}

/* ── POST DETAIL MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);
  z-index:500;align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  width:100%;max-width:580px;background:var(--card);border:1px solid var(--border);
  border-radius:20px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,.7);
  max-height:90vh;overflow-y:auto;
}
.modal-head{
  display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--border);background:rgba(255,255,255,.03);
  position:sticky;top:0;z-index:1;background:var(--card);
}
.modal-title{font-size:.95rem;font-weight:700;flex:1}
.modal-close{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:rgba(255,255,255,.14)}
.modal-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.form-label{font-size:.78rem;color:var(--muted2);margin-bottom:5px}
.form-input,.form-select,.form-textarea{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;color:var(--text);font-size:.88rem;
  outline:none;box-sizing:border-box;
}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--grad2)}
.form-textarea{resize:vertical;min-height:100px;font-family:inherit}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.status-select-wrap{display:flex;gap:6px;flex-wrap:wrap}
.status-btn{padding:7px 14px;border-radius:50px;font-size:.8rem;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted2);font-weight:600}
.status-btn.active-idea   {background:rgba(168,85,247,.2);border-color:var(--grad1);color:#c084fc}
.status-btn.active-draft  {background:rgba(56,189,248,.15);border-color:var(--grad2);color:#7dd3fc}
.status-btn.active-ready  {background:rgba(16,185,129,.15);border-color:#10b981;color:#34d399}
.status-btn.active-posted {background:rgba(107,114,128,.15);border-color:#6b7280;color:var(--muted2)}
.modal-actions{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--border);background:var(--card);position:sticky;bottom:0}
.save-btn{flex:1;padding:11px;background:linear-gradient(135deg,var(--grad1),var(--grad2));border:none;border-radius:10px;color:#fff;font-weight:700;font-size:.88rem;cursor:pointer}
.save-btn:hover{opacity:.88}
.save-btn:disabled{opacity:.45;cursor:default}
.delete-btn{padding:11px 16px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;color:#f87171;font-weight:600;font-size:.88rem;cursor:pointer}
.delete-btn:hover{background:rgba(239,68,68,.2)}

/* ── QUICK-ADD DAY INDICATOR ── */
.cal-day.drop-target{background:rgba(168,85,247,.15)!important;outline:2px dashed rgba(168,85,247,.5);outline-offset:-2px}

/* ── EMPTY MONTH ── */
.empty-month{text-align:center;padding:60px 20px;color:var(--muted);font-size:.9rem;grid-column:span 7}

/* ── TOAST ── */
.snap-toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(0);
  background:linear-gradient(135deg,var(--grad1),var(--grad2));
  color:#fff;font-size:.86rem;font-weight:700;
  padding:12px 28px;border-radius:50px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:9999;
  animation:toastUp .3s ease,toastFade .3s ease 2.2s forwards;
}
@keyframes toastUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes toastFade{to{opacity:0;pointer-events:none}}

/* ── SPINNER ── */
.cal-spinner{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:999;align-items:center;justify-content:center;
}
.cal-spinner.active{display:flex}
.spin-ring{width:40px;height:40px;border:3px solid rgba(255,255,255,.12);border-top-color:var(--grad2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MOBILE ── */
@media(max-width:640px){
  .cal-day{min-height:60px;padding:4px 3px}
  .day-post-pill{display:none}
  .day-num{font-size:.75rem}
  .month-label{min-width:120px;font-size:.95rem}
  .toolbar{gap:6px}
  .view-tabs{display:none}
}
</style>
</head>
<body>

<!-- Nav -->
<nav class="nav">
  <a href="app.html" class="nav-logo">📸 SnapCaption AI</a>
  <div class="nav-links">
    <a href="app.html" class="nav-link">📷 Caption</a>
    <a href="tracker.html" class="nav-link">📊 Tracker</a>
    <a href="calendar.html" class="nav-link active">📅 Calendar</a>
    <a href="pricing.html" class="nav-link">⭐ Upgrade</a>
    <a href="dashboard.html" class="nav-link">👤 Account</a>
  </div>
</nav>

<!-- Spinner -->
<div class="cal-spinner" id="calSpinner"><div class="spin-ring"></div></div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="month-nav">
    <button class="month-btn" onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="monthLabel"></span>
    <button class="month-btn" onclick="changeMonth(1)">›</button>
  </div>
  <button class="today-btn" onclick="goToday()">Today</button>
  <div class="view-tabs">
    <button class="view-tab active" id="tabMonth" onclick="switchView('month')">📅 Month</button>
    <button class="view-tab" id="tabList" onclick="switchView('list')">📋 List</button>
  </div>
  <button class="add-post-btn" onclick="openNewPost()">+ New Post</button>
</div>

<!-- Platform Legend -->
<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:var(--ig)"></div>Instagram</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--tt)"></div>TikTok</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--tw)"></div>Twitter/X</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--li)"></div>LinkedIn</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--fb)"></div>Facebook</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--yt)"></div>YouTube</div>
  <div class="leg-item">
    <div class="leg-dot" style="background:rgba(168,85,247,.4);border:1px solid rgba(168,85,247,.6)"></div>
    <span>Idea</span>
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:rgba(56,189,248,.4);border:1px solid rgba(56,189,248,.6)"></div>
    <span>Draft</span>
  </div>
  <div class="leg-item">
    <div class="leg-dot" style="background:rgba(16,185,129,.4);border:1px solid rgba(16,185,129,.6)"></div>
    <span>Ready</span>
  </div>
</div>

<!-- Month view -->
<div class="cal-wrap" id="calWrap">
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- List view -->
<div class="list-view" id="listView"></div>

<!-- ── POST MODAL ── -->
<div id="postModal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head">
      <span style="font-size:1.1rem;" id="modalIcon">📝</span>
      <div class="modal-title" id="modalTitle">New Post</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- Title -->
      <div>
        <div class="form-label">Title / Topic *</div>
        <input type="text" id="fTitle" class="form-input" placeholder="e.g. Monday motivation post for Instagram">
      </div>
      <!-- Platform + Status -->
      <div class="form-row">
        <div>
          <div class="form-label">Platform</div>
          <select id="fPlatform" class="form-select">
            <option value="instagram">📸 Instagram</option>
            <option value="tiktok">🎵 TikTok</option>
            <option value="twitter">🐦 Twitter/X</option>
            <option value="linkedin">💼 LinkedIn</option>
            <option value="facebook">📘 Facebook</option>
            <option value="youtube">🎬 YouTube</option>
            <option value="pinterest">📌 Pinterest</option>
            <option value="other">📱 Other</option>
          </select>
        </div>
        <div>
          <div class="form-label">Date</div>
          <input type="date" id="fDate" class="form-input">
        </div>
      </div>
      <!-- Time -->
      <div>
        <div class="form-label">Scheduled Time</div>
        <input type="time" id="fTime" class="form-input" value="09:00">
      </div>
      <!-- Status -->
      <div>
        <div class="form-label">Status</div>
        <div class="status-select-wrap" id="statusBtns">
          <button class="status-btn active-idea" data-status="idea" onclick="_setStatus(this,'idea')">💡 Idea</button>
          <button class="status-btn" data-status="draft" onclick="_setStatus(this,'draft')">✏️ Draft</button>
          <button class="status-btn" data-status="ready" onclick="_setStatus(this,'ready')">✅ Ready</button>
          <button class="status-btn" data-status="posted" onclick="_setStatus(this,'posted')">📤 Posted</button>
        </div>
      </div>
      <!-- Caption -->
      <div>
        <div class="form-label">Caption (optional)</div>
        <textarea id="fCaption" class="form-textarea" placeholder="Paste your caption here…"></textarea>
      </div>
      <!-- Notes -->
      <div>
        <div class="form-label">Notes (optional)</div>
        <input type="text" id="fNotes" class="form-input" placeholder="Visual ideas, links, reminders…">
      </div>
    </div>
    <div class="modal-actions">
      <button class="delete-btn" id="deleteBtn" style="display:none" onclick="deletePost()">🗑️ Delete</button>
      <button class="save-btn" id="saveBtn" onclick="savePost()">Save Post</button>
    </div>
  </div>
</div>

<script>
// ── Auth ──────────────────────────────────────────────────────────────────
const token = localStorage.getItem('sc_token');
if (!token) { window.location.href = 'login.html'; }

// ── State ─────────────────────────────────────────────────────────────────
let currentYear  = new Date().getFullYear();
let currentMonth = new Date().getMonth(); // 0-indexed
let postsCache   = {};  // key = "YYYY-MM" → array of posts
let currentView  = 'month';
let editingId    = null;
let selectedStatus = 'idea';

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];
const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const PLAT_ICONS = {
  instagram:'📸',tiktok:'🎵',twitter:'🐦',linkedin:'💼',
  facebook:'📘',youtube:'🎬',pinterest:'📌',other:'📱'
};

// ── Init ──────────────────────────────────────────────────────────────────
init();

async function init() {
  renderCalendar();
  await loadMonth();
}

// ── Month navigation ──────────────────────────────────────────────────────
function changeMonth(delta) {
  currentMonth += delta;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
  renderCalendar();
  loadMonth();
}

function goToday() {
  const now = new Date();
  currentYear  = now.getFullYear();
  currentMonth = now.getMonth();
  renderCalendar();
  loadMonth();
}

function switchView(view) {
  currentView = view;
  document.getElementById('tabMonth').classList.toggle('active', view === 'month');
  document.getElementById('tabList').classList.toggle('active', view === 'list');
  document.getElementById('calWrap').style.display  = view === 'month' ? '' : 'none';
  document.getElementById('listView').classList.toggle('active', view === 'list');
  if (view === 'list') renderList();
}

// ── Load posts for month ──────────────────────────────────────────────────
async function loadMonth() {
  const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}`;
  showSpinner(true);
  try {
    const res = await fetch(`/api/calendar.php?action=list&month=${monthKey}`, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data = await res.json();
    if (data.error === 'premium_required') {
      showSpinner(false);
      showUpgradeNotice();
      return;
    }
    postsCache[monthKey] = data.posts || [];
    renderCalendar();
    if (currentView === 'list') renderList();
  } catch(e) {
    console.error('loadMonth error', e);
  } finally {
    showSpinner(false);
  }
}

// ── Render calendar grid ──────────────────────────────────────────────────
function renderCalendar() {
  const label = document.getElementById('monthLabel');
  label.textContent = `${MONTHS[currentMonth]} ${currentYear}`;

  const grid  = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Day headers
  DAYS.forEach(d => {
    const h = document.createElement('div');
    h.className = 'cal-header-cell';
    h.textContent = d;
    grid.appendChild(h);
  });

  const firstDay    = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const today       = new Date();
  const monthKey    = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}`;
  const posts       = postsCache[monthKey] || [];

  // Build a lookup: day number → posts[]
  const dayMap = {};
  posts.forEach(p => {
    const d = parseInt(p.scheduled_date.split('-')[2]);
    if (!dayMap[d]) dayMap[d] = [];
    dayMap[d].push(p);
  });

  // Fill leading blank days (previous month)
  const prevDays = new Date(currentYear, currentMonth, 0).getDate();
  for (let i = firstDay - 1; i >= 0; i--) {
    const cell = _makeCell(prevDays - i, true, false, null, []);
    grid.appendChild(cell);
  }

  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = (d === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear());
    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cell = _makeCell(d, false, isToday, dateStr, dayMap[d] || []);
    grid.appendChild(cell);
  }

  // Trailing blank days
  const totalCells = firstDay + daysInMonth;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= trailing; i++) {
    const cell = _makeCell(i, true, false, null, []);
    grid.appendChild(cell);
  }
}

function _makeCell(day, otherMonth, isToday, dateStr, posts) {
  const cell = document.createElement('div');
  cell.className = 'cal-day' + (otherMonth ? ' other-month' : '') + (isToday ? ' today' : '');
  if (dateStr) {
    cell.onclick = (e) => { if (e.target.closest('.day-post-pill') || e.target.closest('.day-more')) return; openNewPost(dateStr); };
  }

  const num = document.createElement('div');
  num.className = 'day-num';
  num.textContent = day;
  cell.appendChild(num);

  if (!otherMonth && posts.length > 0) {
    const postsWrap = document.createElement('div');
    postsWrap.className = 'day-posts';
    const maxShow = 3;
    posts.slice(0, maxShow).forEach(p => {
      const pill = _makePostPill(p);
      postsWrap.appendChild(pill);
    });
    if (posts.length > maxShow) {
      const more = document.createElement('div');
      more.className = 'day-more';
      more.textContent = `+${posts.length - maxShow} more`;
      more.onclick = (e) => { e.stopPropagation(); openDayPosts(dateStr, posts); };
      postsWrap.appendChild(more);
    }
    cell.appendChild(postsWrap);
  }

  return cell;
}

function _makePostPill(post) {
  const platKey = post.platform.toLowerCase();
  const pill = document.createElement('div');
  pill.className = `day-post-pill status-${post.status}`;
  pill.onclick = (e) => { e.stopPropagation(); openEditPost(post); };

  const dot = document.createElement('div');
  dot.className = `pill-dot pc-${platKey}`;
  pill.appendChild(dot);

  const title = document.createElement('div');
  title.className = 'pill-title';
  title.textContent = (PLAT_ICONS[platKey] || '📱') + ' ' + (post.title || '');
  pill.appendChild(title);

  return pill;
}

// ── List view ─────────────────────────────────────────────────────────────
function renderList() {
  const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2,'0')}`;
  const posts    = (postsCache[monthKey] || []).slice().sort((a, b) => {
    return (a.scheduled_date + a.scheduled_time).localeCompare(b.scheduled_date + b.scheduled_time);
  });
  const container = document.getElementById('listView');
  container.innerHTML = '';

  if (!posts.length) {
    container.innerHTML = '<div style="text-align:center;padding:60px;color:#78788a;font-size:.9rem;">No posts scheduled this month. <a href="#" onclick="openNewPost()" style="color:#a855f7">Add one →</a></div>';
    return;
  }

  // Group by date
  const groups = {};
  posts.forEach(p => {
    if (!groups[p.scheduled_date]) groups[p.scheduled_date] = [];
    groups[p.scheduled_date].push(p);
  });

  Object.entries(groups).forEach(([date, dayPosts]) => {
    const d = new Date(date + 'T12:00:00');
    const label = document.createElement('div');
    label.className = 'list-date-label';
    label.textContent = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
    container.appendChild(label);

    dayPosts.forEach(p => {
      const platKey = p.platform.toLowerCase();
      const card = document.createElement('div');
      card.className = 'list-post-card';
      card.onclick = () => openEditPost(p);
      card.innerHTML = `
        <div style="width:4px;height:40px;border-radius:4px;background:var(--${platKey === 'twitter' ? 'tw' : platKey === 'instagram' ? 'ig' : platKey === 'tiktok' ? 'tt' : platKey === 'linkedin' ? 'li' : platKey === 'facebook' ? 'fb' : platKey === 'youtube' ? 'yt' : 'ot'});flex-shrink:0;"></div>
        <div class="lpc-time">${p.scheduled_time ? p.scheduled_time.substring(0,5) : ''}</div>
        <div class="lpc-title">${escHtml(p.title)}</div>
        <div class="lpc-plat-badge">${PLAT_ICONS[platKey] || '📱'} ${platKey.charAt(0).toUpperCase() + platKey.slice(1)}</div>
        <div class="lpc-status status-${p.status}" style="border:1px solid;border-radius:50px;padding:3px 8px;">${_statusLabel(p.status)}</div>
      `;
      container.appendChild(card);
    });
  });
}

function _statusLabel(s) {
  return { idea:'💡 Idea', draft:'✏️ Draft', ready:'✅ Ready', posted:'📤 Posted' }[s] || s;
}

// ── Modal ─────────────────────────────────────────────────────────────────
function openNewPost(dateStr) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Post';
  document.getElementById('modalIcon').textContent = '📝';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('fTitle').value = '';
  document.getElementById('fPlatform').value = 'instagram';
  document.getElementById('fDate').value = dateStr || new Date().toISOString().split('T')[0];
  document.getElementById('fTime').value = '09:00';
  document.getElementById('fCaption').value = '';
  document.getElementById('fNotes').value = '';
  _setStatus(document.querySelector('[data-status="idea"]'), 'idea');
  document.getElementById('postModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => document.getElementById('fTitle').focus(), 100);
}

function openEditPost(post) {
  editingId = post.id;
  document.getElementById('modalTitle').textContent = 'Edit Post';
  document.getElementById('modalIcon').textContent = PLAT_ICONS[post.platform.toLowerCase()] || '📱';
  document.getElementById('deleteBtn').style.display = '';
  document.getElementById('fTitle').value    = post.title || '';
  document.getElementById('fPlatform').value = post.platform.toLowerCase();
  document.getElementById('fDate').value     = post.scheduled_date || '';
  document.getElementById('fTime').value     = (post.scheduled_time || '09:00:00').substring(0,5);
  document.getElementById('fCaption').value  = post.caption || '';
  document.getElementById('fNotes').value    = post.notes || '';
  _setStatus(document.querySelector(`[data-status="${post.status}"]`), post.status);
  document.getElementById('postModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openDayPosts(dateStr, posts) {
  // For now — just open new post for that date; can expand to a day detail view later
  openNewPost(dateStr);
}

function closeModal() {
  document.getElementById('postModal').classList.remove('open');
  document.body.style.overflow = '';
  editingId = null;
}

function _setStatus(btn, status) {
  selectedStatus = status;
  document.querySelectorAll('.status-btn').forEach(b => {
    b.className = 'status-btn';
    if (b.dataset.status === status) b.classList.add(`active-${status}`);
  });
}

// ── Save / Delete ─────────────────────────────────────────────────────────
async function savePost() {
  const title   = document.getElementById('fTitle').value.trim();
  const platform= document.getElementById('fPlatform').value;
  const date    = document.getElementById('fDate').value;
  const time    = document.getElementById('fTime').value || '09:00';
  const caption = document.getElementById('fCaption').value.trim();
  const notes   = document.getElementById('fNotes').value.trim();

  if (!title) { _toast('Please enter a title'); return; }
  if (!date)  { _toast('Please pick a date'); return; }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const body = {
    action: editingId ? 'update' : 'create',
    title, platform, scheduled_date: date, scheduled_time: time + ':00',
    status: selectedStatus, caption: caption || null, notes: notes || null,
  };
  if (editingId) body.id = editingId;

  try {
    const res  = await fetch('/api/calendar.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.ok || data.error === undefined) {
      closeModal();
      await loadMonth();
      _toast(editingId ? '✅ Post updated' : '✅ Post added to calendar');
    } else {
      _toast(data.error || 'Save failed');
    }
  } catch(e) {
    _toast('Network error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Post';
  }
}

async function deletePost() {
  if (!editingId) return;
  if (!confirm('Delete this post from calendar?')) return;
  try {
    const res  = await fetch('/api/calendar.php', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
      body: JSON.stringify({ action: 'delete', id: editingId }),
    });
    const data = await res.json();
    closeModal();
    await loadMonth();
    _toast('🗑️ Post deleted');
  } catch(e) {
    _toast('Delete failed');
  }
}

// ── Premium gate notice ───────────────────────────────────────────────────
function showUpgradeNotice() {
  document.getElementById('calGrid').innerHTML = `
    <div class="empty-month" style="display:flex;flex-direction:column;align-items:center;gap:14px;">
      <div style="font-size:2.5rem;">📅</div>
      <div style="font-size:1.1rem;font-weight:700;">Content Calendar — Premium Feature</div>
      <div style="font-size:.88rem;color:#78788a;max-width:360px;text-align:center;">
        Plan your content weeks ahead, track post status, and never miss a schedule.
      </div>
      <a href="pricing.html" style="margin-top:4px;padding:11px 28px;background:linear-gradient(135deg,#a855f7,#38bdf8);border-radius:50px;color:#fff;font-weight:700;text-decoration:none;">Upgrade to Premium →</a>
    </div>
  `;
}

// ── Helpers ───────────────────────────────────────────────────────────────
function showSpinner(on) {
  document.getElementById('calSpinner').classList.toggle('active', on);
}

function _toast(msg) {
  const t = document.createElement('div');
  t.className = 'snap-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2700);
}

function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Pre-fill date from URL param if any (from "schedule" button in app.html)
(function() {
  const params = new URLSearchParams(window.location.search);
  const d = params.get('date');
  const p = params.get('platform');
  const c = params.get('caption');
  if (d) {
    // Trigger open after init
    window.addEventListener('load', () => {
      setTimeout(() => {
        openNewPost(d);
        if (p) document.getElementById('fPlatform').value = p.toLowerCase();
        if (c) document.getElementById('fCaption').value = decodeURIComponent(c);
      }, 400);
    });
  }
})();
</script>
