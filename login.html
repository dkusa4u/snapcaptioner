<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SnapCaption">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Sign In — SnapCaption AI</title>
<meta name="description" content="Sign in to your SnapCaption AI account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090f;
    --bg2: #0f0f1a;
    --bg3: #141424;
    --card: #13131f;
    --border: #1e1e32;
    --border2: #2a2a44;
    --grad1: #7c3aed;
    --grad2: #a855f7;
    --grad3: #ec4899;
    --text: #e8e8f0;
    --muted: #6b7280;
    --muted2: #9ca3af;
    --green: #10b981;
    --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  /* ── BACKGROUND GLOW ── */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .glow-blob {
    position: absolute; border-radius: 50%; filter: blur(120px); opacity: .12;
  }
  .glow-blob-1 {
    width: 500px; height: 500px;
    background: var(--grad1);
    top: -150px; left: -100px;
  }
  .glow-blob-2 {
    width: 400px; height: 400px;
    background: var(--grad3);
    bottom: -100px; right: -100px;
  }

  /* ── NAV ── */
  nav {
    position: relative; z-index: 10;
    padding: 20px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1.1rem; font-weight: 800; color: var(--text);
    text-decoration: none;
  }
  .logo-icon {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--grad1), var(--grad3));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .nav-link {
    font-size: .88rem; color: var(--muted2); text-decoration: none;
    transition: color .2s;
  }
  .nav-link:hover { color: var(--text); }
  .nav-link span {
    color: var(--grad2); font-weight: 600;
  }

  /* ── MAIN ── */
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; z-index: 1;
  }

  /* ── AUTH CARD ── */
  .auth-card {
    width: 100%; max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px;
    box-shadow: 0 40px 80px rgba(0,0,0,.5), 0 0 60px rgba(124,58,237,.06);
  }

  .auth-logo {
    display: flex; align-items: center; gap: 10px;
    font-size: 1rem; font-weight: 800;
    margin-bottom: 32px; justify-content: center;
  }
  .auth-logo .logo-icon-sm {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--grad1), var(--grad3));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .auth-heading {
    font-size: 1.6rem; font-weight: 800;
    letter-spacing: -.02em; margin-bottom: 6px;
    text-align: center;
  }
  .auth-sub {
    font-size: .88rem; color: var(--muted2);
    text-align: center; margin-bottom: 32px;
  }

  /* ── SOCIAL BTNS ── */
  .social-btns {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 24px;
  }
  .social-btn {
    width: 100%; padding: 12px;
    background: var(--bg2); border: 1px solid var(--border2);
    border-radius: 10px; color: var(--text);
    font-size: .9rem; font-weight: 500;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer; text-decoration: none;
    transition: border-color .2s, background .2s;
  }
  .social-btn:hover { border-color: var(--border2); background: var(--bg3); }
  .social-btn img, .social-btn .s-icon { width: 18px; height: 18px; flex-shrink: 0; }

  /* ── DIVIDER ── */
  .divider {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px;
  }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: .78rem; color: var(--muted); white-space: nowrap; }

  /* ── FORM ── */
  .form-group { margin-bottom: 16px; }
  .form-label {
    display: block; font-size: .82rem; font-weight: 600;
    color: var(--muted2); margin-bottom: 7px;
  }
  .form-input {
    width: 100%; padding: 12px 14px;
    background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-size: .93rem; font-family: 'Inter', sans-serif;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .form-input::placeholder { color: var(--muted); }
  .form-input:focus {
    border-color: var(--grad2);
    box-shadow: 0 0 0 3px rgba(168,85,247,.12);
  }
  .form-input.error { border-color: var(--red); }

  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: .82rem; padding: 4px;
    transition: color .2s;
  }
  .pw-toggle:hover { color: var(--muted2); }

  .form-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; margin-top: -4px;
  }
  .remember-label {
    display: flex; align-items: center; gap: 7px;
    font-size: .82rem; color: var(--muted2); cursor: pointer;
  }
  .remember-label input { accent-color: var(--grad2); cursor: pointer; }
  .forgot-link {
    font-size: .82rem; color: var(--grad2); text-decoration: none;
    font-weight: 500; transition: opacity .2s;
  }
  .forgot-link:hover { opacity: .8; }

  .error-msg {
    display: none; background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.2);
    border-radius: 8px; padding: 10px 14px;
    font-size: .82rem; color: #fca5a5;
    margin-bottom: 16px;
  }
  .error-msg.show { display: flex; align-items: center; gap: 8px; }

  /* ── SUBMIT BTN ── */
  .submit-btn {
    width: 100%; padding: 13px;
    border-radius: 10px; font-size: .95rem;
    font-weight: 600; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--grad1), var(--grad3));
    color: #fff;
    transition: opacity .2s, transform .15s;
    position: relative;
  }
  .submit-btn:hover { opacity: .9; transform: translateY(-1px); }
  .submit-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-spinner {
    display: none; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
    animation: spin .7s linear infinite;
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .btn-text { transition: opacity .2s; }

  /* ── FOOTER LINK ── */
  .auth-footer {
    text-align: center; margin-top: 24px;
    font-size: .88rem; color: var(--muted2);
  }
  .auth-footer a {
    color: var(--grad2); font-weight: 600; text-decoration: none;
  }
  .auth-footer a:hover { opacity: .8; }

  /* ── PLAN BADGE ── */
  .plan-badge {
    display: flex; align-items: center; gap: 10px;
    background: rgba(124,58,237,.08);
    border: 1px solid rgba(124,58,237,.2);
    border-radius: 10px; padding: 12px 14px;
    margin-bottom: 24px;
    font-size: .82rem; color: var(--muted2);
  }
  .plan-badge .pb-icon { font-size: 1.1rem; }
  .plan-badge strong { color: var(--text); }

  @media(max-width: 480px) {
    .auth-card { padding: 32px 22px; }
  }
</style>
</head>
<body>

<div class="bg-glow">
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>
</div>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">📸</div>
    SnapCaption AI
  </a>
  <a href="signup.html" class="nav-link">New here? <span>Sign up free →</span></a>
</nav>

<main>
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-icon-sm">📸</div>
      SnapCaption AI
    </div>

    <!-- shown when ?plan=premium in URL -->
    <div class="plan-badge" id="plan-badge" style="display:none">
      <span class="pb-icon">⭐</span>
      <span>Sign in to activate your <strong>Premium</strong> plan</span>
    </div>

    <h1 class="auth-heading">Welcome back</h1>
    <p class="auth-sub">Sign in to your account to continue</p>

    <!-- SOCIAL LOGIN -->
    <div class="social-btns">
      <a href="api/auth-google.php" class="social-btn">
        <svg class="s-icon" viewBox="0 0 24 24" fill="none">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>
      <a href="api/auth-apple.php" class="social-btn">
        <svg class="s-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.7 9.05 7.4c1.33.07 2.26.76 3.03.78 1.15-.21 2.25-.92 3.47-.83 1.47.12 2.59.68 3.32 1.73-3.04 1.82-2.32 5.81.49 7.03-.59 1.37-1.38 2.73-2.31 4.17zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
        Continue with Apple
      </a>
    </div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or sign in with email</span>
      <div class="divider-line"></div>
    </div>

    <!-- ERROR -->
    <div class="error-msg" id="error-msg">
      <span>⚠️</span>
      <span id="error-text">Invalid email or password.</span>
    </div>

    <!-- FORM -->
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input
          type="email" id="email" name="email"
          class="form-input" placeholder="you@example.com"
          autocomplete="email" required
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input
            type="password" id="password" name="password"
            class="form-input" placeholder="••••••••"
            autocomplete="current-password" required
          >
          <button type="button" class="pw-toggle" onclick="togglePw('password', this)">Show</button>
        </div>
      </div>
      <div class="form-row">
        <label class="remember-label">
          <input type="checkbox" name="remember" checked>
          Remember me
        </label>
        <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">
        <span class="btn-text">Sign In</span>
        <div class="btn-spinner" id="btn-spinner"></div>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Sign up free</a>
    </div>

  </div>
</main>

<script>
  // Show plan badge if redirected from pricing
  const urlParams = new URLSearchParams(window.location.search);
  const plan = urlParams.get('plan');
  if (plan === 'premium' || plan === 'teams') {
    const badge = document.getElementById('plan-badge');
    badge.style.display = 'flex';
    badge.querySelector('strong').textContent = plan.charAt(0).toUpperCase() + plan.slice(1);
  }

  // Show OAuth error if redirected back from auth-google / auth-apple
  const oauthErr = urlParams.get('error');
  if (oauthErr) {
    const msgMap = {
      google_not_configured: 'Google Sign-In isn\'t enabled yet. Please sign in with email & password below.',
    };
    const msg = msgMap[oauthErr] || decodeURIComponent(oauthErr);
    const errBox = document.getElementById('error-msg');
    document.getElementById('error-text').textContent = msg;
    if (errBox) errBox.classList.add('show');
  }

  function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.textContent = 'Hide';
    } else {
      input.type = 'password';
      btn.textContent = 'Show';
    }
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    const spinner = document.getElementById('btn-spinner');
    const btnText = btn.querySelector('.btn-text');
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');

    // Clear errors
    errorMsg.classList.remove('show');
    document.getElementById('email').classList.remove('error');
    document.getElementById('password').classList.remove('error');

    // Loading state
    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.style.opacity = '0';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const remember = document.querySelector('[name=remember]').checked;

    try {
      const res = await fetch('api/auth-login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, remember })
      });

      let data;
      try { data = await res.json(); } catch(e) { data = {}; }

      if (res.ok && data.success) {
        // Store session token
        if (data.token) {
          localStorage.setItem('sc_token', data.token);
          localStorage.setItem('sc_user', JSON.stringify({ email: data.user.email, plan: data.user.plan, name: data.user.name }));
        }
        // Redirect
        const redirect = urlParams.get('redirect') || (plan ? `app.html?plan=${plan}` : 'app.html');
        window.location.href = redirect;
      } else if (res.status === 503 || data.error === 'server_not_configured') {
        showError('The server is being set up. Please try again in a few minutes.');
      } else {
        showError(data.message || 'Invalid email or password.');
        document.getElementById('password').classList.add('error');
      }
    } catch (err) {
      showError('Unable to connect. Please check your internet connection and try again.');
    }

    btn.disabled = false;
    spinner.style.display = 'none';
    btnText.style.opacity = '1';
  }

  function showError(msg) {
    const errorMsg = document.getElementById('error-msg');
    document.getElementById('error-text').textContent = msg;
    errorMsg.classList.add('show');
  }
</script>
</body>
</html>
